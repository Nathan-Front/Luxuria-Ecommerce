<section class="checkout-first-sec">
  <aside class="order-summary">
    <h2 id="order-summary-title" data-i18n="checkoutOrderSummary"></h2>
    <span class="checkout-quantity"></span>
    <div id="loading-product" class="product-loading" hidden>
      <div class="product-spinner"></div>
      <p>Retrieving data...</p>
    </div>
    <ul class="cart-items"></ul>

    <div class="checkout-totals">
      <p>
        <span data-i18n="checkoutSubTotal"></span>
        <span class="checkout-subtotal">00</span>
      </p>
      <p>
        <span data-i18n="checkoutDelFee"></span>
        <span class="checkout-del-fee">00</span>
      </p>
      <p>
        <span data-i18n="checkoutTax"></span
        ><span class="checkout-tax">00</span>
      </p>
      <p>
        <span data-i18n="checkoutGrand"></span
        ><span class="checkout-total">00</span>
      </p>
    </div>
    <div class="free-shipping-cont summary-footer">
      <img
        src="./images/cart/secondSection/delivery-fast.svg"
        alt="shipping-icon"
      />
      <div>
        <p class="freeShip"></p>
        <p class="difference"></p>
      </div>
    </div>
    <div class="summary-footer">
      <img
        src="./images/cart/secondSection/secure-shield.svg"
        alt="shield-icon"
      />
      <div>
        <p data-i18n="checkoutSecure"></p>
        <p data-i18n="checkoutSecureText"></p>
      </div>
    </div>
    <div class="summary-footer">
      <img
        src="./images/cart/secondSection/delivery-fast.svg"
        alt="shipping-icon"
      />
      <div>
        <p data-i18n="checkoutFast"></p>
        <p data-i18n="checkoutFastText"></p>
      </div>
    </div>
    <div class="summary-footer">
      <img src="./images/cart/secondSection/email.svg" alt="shipping-icon" />
      <div>
        <p data-i18n="checkoutSupport"></p>
        <p data-i18n="checkoutSupportText"></p>
      </div>
    </div>
  </aside>

  <div class="checkout-right-con">
    <h3 data-i18n="checkoutTitle"></h3>
    <p data-i18n="checkoutTitleText"></p>
    <form>
      <div class="user-details-con">
        <div class="form-header">
          <div>
            <img src="./images/checkout/location-pin.svg" alt="location-icon" />
            <h4 data-i18n="checkoutAddress"></h4>
          </div>
          <p data-i18n="checkoutAddressInfo"></p>
        </div>
        <div class="user-input-con">
          <div class="name-email">
            <div>
              <label data-i18n="checkoutName"></label>
              <input type="text" id="full-name" class="paypal-init" required />
            </div>
            <div>
              <label data-i18n="checkoutEmail"></label>
              <input type="email" id="email" class="paypal-init" required />
            </div>
          </div>
          <div class="contact-address">
            <div>
              <label data-i18n="checkoutContact"></label>
              <input
                type="text"
                id="contact-number"
                class="paypal-init"
                required
              />
            </div>
            <div>
              <label data-i18n="checkoutShip"></label>
              <input
                type="text"
                id="shipping-address"
                class="paypal-init"
                required
              />
            </div>
          </div>
        </div>
      </div>
      <div class="user-payment-con">
        <div class="form-header">
          <div>
            <img src="./images/checkout/card.svg" alt="card-icon" />
            <h4 data-i18n="checkoutPayment"></h4>
          </div>
          <p data-i18n="checkoutPaymentText"></p>
        </div>
        <div id="payment-message" class="payment-message"></div>
        <div class="paypal-selection">
          <label class="payment-option">
            <input
              type="radio"
              name="paymentMethod"
              id="paypal"
              value="paypal"
            />
            <span data-i18n="checkoutCredit"></span>
            <div class="payment-card-con">
              <img src="./images/checkout/paypal.svg" alt="paypal" />
              <img src="./images/checkout/visa.svg" alt="visa" />
              <img src="./images/checkout/mastercard.svg" alt="mastercard" />
            </div>
          </label>
          <div class="paypal-btn-con">
            <div id="paypal-button-container"></div>
            <p id="result-message"></p>
          </div>
        </div>
        <div class="cod-selection">
          <label class="payment-option">
            <input
              type="radio"
              name="paymentMethod"
              id="cashOnDelivery"
              value="cash-on-delivery"
            />
            <span data-i18n="checkoutCOD"></span>
            <div class="payment-card-con">
              <img src="./images/checkout/money-cash.svg" alt="cash" />
            </div>
          </label>
          <div class="cod-btn-con">
            <button
              id="place-order-btn"
              type="button"
              data-i18n="checkoutPlaceOrder"
            >
              Place Order
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</section>
