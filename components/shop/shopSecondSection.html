<section class="shop-second-sec">
  <aside class="aside">
    <div class="reset-filters-con">
      <img
        src="./images/shop/secondSection/filter-options.svg"
        alt="filter-options"
        class="display-filter-tablet"
      />
      <h4 data-i18n="filter">Filter</h4>
      <button type="button" class="reset-filter" data-i18n="clearAll">
        Clear all
      </button>
    </div>
    <div class="category-fieldset-con filter-tablet">
      <div class="filter-titles">
        <h4 data-i18n="category">Category</h4>
        <img
          src="./images/shop/secondSection/arrow-down.svg"
          alt="arrow-icon"
          class="filters-arrow"
        />
      </div>

      <fieldset class="category-fieldset hide-select-cont">
        <label>
          <input type="checkbox" name="category" value="men" />
          <span data-i18n="filterMen">Men</span>
        </label>
        <label>
          <input type="checkbox" name="category" value="women" />
          <span data-i18n="filterWomen">Women</span>
        </label>
        <label>
          <input type="checkbox" name="category" value="dress" />
          <span data-i18n="filterDresses">Dresses</span>
        </label>
        <label>
          <input type="checkbox" name="category" value="tops" />
          <span data-i18n="filterTops">Tops</span>
        </label>
        <label>
          <input type="checkbox" name="category" value="bags" />
          <span data-i18n="filterBags">Bags</span>
        </label>
        <label>
          <input type="checkbox" name="category" value="accessory" />
          <span data-i18n="filterAccessories">Accessories</span>
        </label>
      </fieldset>
    </div>
    <div class="price-sliders-con filter-tablet">
      <div class="filter-titles">
        <h4 data-i18n="filterPriceRange">Price Range</h4>
        <img
          src="./images/shop/secondSection/arrow-down.svg"
          alt="arrow-icon"
          class="filters-arrow"
        />
      </div>
      <div class="price-sliders hide-select-cont">
        <div class="category-list price-filter">
          <span><span id="min-value">0</span></span>
          <span><span id="max-value">200</span></span>
        </div>
        <div class="range-slider">
          <div class="slider-tracker"></div>
          <input
            type="range"
            id="min-price"
            min="0"
            max="199"
            value="0"
            aria-label="min-price"
          />
          <input
            type="range"
            id="max-price"
            min="1"
            max="200"
            value="200"
            aria-label="max-price"
          />
        </div>
      </div>
    </div>
    <div class="feature-con filter-tablet">
      <div class="filter-titles">
        <h4 data-i18n="filterFeatures">Features</h4>
        <img
          src="./images/shop/secondSection/arrow-down.svg"
          alt="arrow-icon"
          class="filters-arrow"
        />
      </div>
      <div class="sort-by hide-select-cont">
        <label for="features" data-i18n="filterSortBy">Sort by:</label>
        <select name="feature" id="features">
          <option value="" data-i18n="filterSortByDefault">Default</option>
          <option value="new" data-i18n="filterSortByNew">New</option>
          <option value="best-seller" data-i18n="filterSortByBestSeller">
            Best Seller
          </option>
          <option value="sale" data-i18n="filterSortBySale">Sale</option>
        </select>
      </div>
    </div>
  </aside>
  <article>
    <p>
      <span data-i18n="countShowing">Showing item</span>
      <span class="start-count"></span> - <span class="end-count"></span>
      <span data-i18n="countOutOF">out of</span>
      <span class="total-count"></span><span data-i18n="countTotalJA"></span>
    </p>
    <div id="loading-product" class="product-loading" hidden>
      <div class="product-spinner"></div>
      <p>Retrieving data...</p>
    </div>
    <ul class="products-lists"></ul>
    <div class="pagination"></div>
  </article>
</section>
