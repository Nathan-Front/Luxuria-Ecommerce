<section class="shop-second-sec">
  <aside class="aside">
    <div class="reset-filters-con">
      <img
        src="./images/shop/secondSection/filter-options.svg"
        alt="filter-options"
        class="display-filter-tablet"
      />
      <h4 data-i18n="filter"></h4>
      <button type="button" class="reset-filter" data-i18n="clearAll"></button>
    </div>
    <div class="category-fieldset-con filter-tablet">
      <div class="filter-titles">
        <h4 data-i18n="category"></h4>
        <img
          src="./images/shop/secondSection/arrow-down.svg"
          alt="arrow-icon"
          class="filters-arrow"
        />
      </div>

      <fieldset class="category-fieldset hide-select-cont">
        <label>
          <input type="checkbox" name="category" value="men" />
          <span data-i18n="filterMen"></span>
        </label>
        <label>
          <input type="checkbox" name="category" value="women" />
          <span data-i18n="filterWomen"></span>
        </label>
        <label>
          <input type="checkbox" name="category" value="dress" />
          <span data-i18n="filterDresses"></span>
        </label>
        <label>
          <input type="checkbox" name="category" value="tops" />
          <span data-i18n="filterTops"></span>
        </label>
        <label>
          <input type="checkbox" name="category" value="bags" />
          <span data-i18n="filterBags"></span>
        </label>
        <label>
          <input type="checkbox" name="category" value="accessory" />
          <span data-i18n="filterAccessories"></span>
        </label>
      </fieldset>
    </div>
    <div class="price-sliders-con filter-tablet">
      <div class="filter-titles">
        <h4 data-i18n="filterPriceRange"></h4>
        <img
          src="./images/shop/secondSection/arrow-down.svg"
          alt="arrow-icon"
          class="filters-arrow"
        />
      </div>
      <div class="price-sliders hide-select-cont">
        <div class="category-list price-filter">
          <span><span id="min-value"></span></span>
          <span><span id="max-value"></span></span>
        </div>
        <div class="range-slider">
          <div class="slider-tracker"></div>
          <input
            type="range"
            id="min-price"
            min="0"
            max="199"
            value="0"
            aria-label="min-price"
          />
          <input
            type="range"
            id="max-price"
            min="1"
            max="200"
            value="200"
            aria-label="max-price"
          />
        </div>
      </div>
    </div>
    <div class="feature-con filter-tablet">
      <div class="filter-titles">
        <h4 data-i18n="filterFeatures"></h4>
        <img
          src="./images/shop/secondSection/arrow-down.svg"
          alt="arrow-icon"
          class="filters-arrow"
        />
      </div>
      <div class="sort-by hide-select-cont">
        <label for="features" data-i18n="filterSortBy"></label>
        <select name="feature" id="features">
          <option value="" data-i18n="filterSortByDefault"></option>
          <option value="new" data-i18n="filterSortByNew"></option>
          <option
            value="best-seller"
            data-i18n="filterSortByBestSeller"
          ></option>
          <option value="sale" data-i18n="filterSortBySale"></option>
        </select>
      </div>
    </div>
  </aside>
  <article class="shop-article-section">
    <p>
      <span data-i18n="countShowing"></span>
      <span class="start-count"></span> - <span class="end-count"></span>
      <span data-i18n="countOutOF"></span>
      <span class="total-count"></span><span data-i18n="countTotalJA"></span>
    </p>
    <ul class="products-lists"></ul>
    <div class="pagination"></div>
  </article>
</section>
