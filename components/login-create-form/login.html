<div class="login-overlay">
  <div class="login-modal">
    <button class="close-login" type="button">×</button>

    <h2 data-i18n="loginTitle"></h2>
    <p data-i18n="loginTitleText"></p>
    <form class="login-form">
      <input
        type="email"
        data-i18n-placeholder="emailPlaceholder"
        autocomplete="email"
        id="email-input"
      />
      <input
        type="password"
        data-i18n-placeholder="passwordPlaceholder"
        id="password-input"
        autocomplete="current-password"
      />

      <div>
        <input type="checkbox" value="lsRememberMe" id="rememberMe" />
        <label for="rememberMe" data-i18n="loginRememberMe"></label>
        <a href="#" data-i18n="loginForgotPass"></a>
      </div>
      <input
        type="text"
        name="website"
        class="login_honeypot"
        placeholder="Leave this field empty"
      />
      <button
        type="submit"
        class="login-btn"
        data-i18n="loginLoginBtn"
      ></button>
    </form>
  </div>
  <div class="login-form-lower">
    <p class="or-divider"><span data-i18n="loginContinue"></span></p>
    <button type="button" class="google-login-btn">
      <img
        src="./images/login-create/google-svgrepo-com.svg"
        alt="google-icon"
      />
      <span data-i18n="loginGoogle"></span>
    </button>
    <p class="to-create-acnt">
      <span data-i18n="loginNoAccount"></span>

      <button
        type="button"
        class="create-account-btn"
        data-i18n="loginCreateAcc"
      ></button>
    </p>
  </div>
</div>
