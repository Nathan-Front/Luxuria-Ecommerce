<div class="create-account-con">
  <div class="create-account-modal">
    <button type="button" class="close-create-account">×</button>
    <h2 data-i18n="createAccountTitle"></h2>
    <p data-i18n="createAccountTitleText"></p>
    <form class="create-account-form">
      <div class="name-container">
        <label for="firstName"
          ><span data-i18n="createAccountFirstName"></span
          ><input
            type="text"
            id="firstName"
            class="required-create-inputs"
            data-i18n-placeholder="FirstNamePlaceholder"
        /></label>

        <label for="lastName"
          ><span data-i18n="createAccountLastName"></span
          ><input
            type="text"
            id="lastName"
            class="required-create-inputs"
            data-i18n-placeholder="lastNamePlaceholder"
        /></label>
      </div>
      <label for="userEmail"></label>
      <input
        type="email"
        id="userEmail"
        class="required-create-inputs"
        data-i18n-placeholder="createEmailPlaceholder"
        autocomplete="email"
      />
      <label for="password"></label>
      <input
        type="password"
        id="password"
        class="required-create-inputs"
        data-i18n-placeholder="createPassPlaceholder"
        autocomplete="new-password"
      />

      <div class="eula-container">
        <label for="eula" class="eula"
          ><input type="checkbox" id="eula" disabled />EULA</label
        >
        <p>
          <span data-i18n="createAccountAgree"></span>
          <a href="#" data-i18n="createAccountTerms"></a>
          <span data-i18n="createAccountAnd"></span>
          <a href="#" data-i18n="createAccountPolicy"></a>
        </p>
      </div>
      <input
        type="text"
        name="website"
        class="__honeypot"
        placeholder="Leave this field empty"
      />
      <button
        type="submit"
        class="create-account-submit"
        data-i18n="createAccountButton"
        disabled
      ></button>
    </form>
  </div>
  <div class="create-account-lower">
    <p class="or-divider"><span>OR</span></p>
    <p class="sign-in-link">
      <span data-i18n="createAccountAlready"></span>
      <button
        type="button"
        class="return-to-sign-in"
        data-i18n="createAccountToLogin"
      ></button>
    </p>
  </div>
</div>
